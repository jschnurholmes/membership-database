# MySQL. Versions 5.7.8 and up are supported.
#
# Install the MySQL driver
#   gem install mysql2
#
# Ensure the MySQL gem is defined in your Gemfile
#   gem "mysql2"
#
default: &default
  adapter: mysql2
  encoding: utf8mb4
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  username: root

development:
  <<: *default
  database: members_dev
  password: <%= ENV.fetch("MYSQL_ROOT_PASSWORD") { nil } %>
  host: mariadb
  port: 3306

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: members_test
  password: <%= ENV.fetch("MYSQL_ROOT_PASSWORD") { nil } %>
  host: mariadb
  port: 3306

production:
  <<: *default
  database: <%= ENV.fetch("DB_NAME") { "members" } %>
  host: <%= ENV.fetch("DB_HOST") { nil } %>
  port: <%= ENV.fetch("DB_PORT") { 3306 } %>
  username: <%= ENV.fetch("DB_USERNAME") { nil } %>
  password: <%= ENV.fetch("DB_PASSWORD") { nil } %>
